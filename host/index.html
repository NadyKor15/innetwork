<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>InNetwork · Echo Show 8 simulator</title>
<link rel="stylesheet" href="/host.css">
<script src="/config.js"></script>
</head>
<body data-demo="idle" data-beat="0" data-busy="0" data-mode="device">
<div id="stage">
  <section id="device-col" aria-label="Simulated device">
    <p class="frame-caption">Echo Show 8 simulator (1280x800 frame)</p>
    <div id="device">
      <div id="screen" data-view="" data-band="none">
        <div id="chrome" hidden>
          <header class="app-bar">
            <div class="brand">
              <svg class="brand-mark" viewBox="0 0 76 28" aria-hidden="true"><circle class="m1" cx="14" cy="14" r="13"/><circle class="m2" cx="35" cy="14" r="13"/><circle class="m3" cx="56" cy="14" r="13"/></svg>
              <span class="brand-name">InNetwork</span>
            </div>
            <span class="demo-tag" id="demo-tag">demo data</span>
          </header>
          <section id="band" aria-label="Conversation">
            <p id="band-ask"></p>
            <p id="band-reply"><span id="band-reply-1"></span><span id="band-reply-2"></span></p>
          </section>
        </div>
        <div id="card"></div>
        <div id="devboard" hidden aria-label="Behind the scenes"></div>
      </div>
      <p class="sim-mark">Alexa+ simulated in our web host</p>
    </div>
    <div id="subtitles" aria-live="polite">
      <p id="sub-user"></p>
      <p id="sub-line"><span id="sub-alexa"></span><span id="sub-seconds"></span></p>
    </div>
    <form id="say" autocomplete="off">
      <button type="button" id="mic" class="ctl icon" title="Speak (Web Speech API, where the browser has it)" disabled aria-label="Speak">
        <svg viewBox="0 0 14 20" aria-hidden="true"><rect x="4" y="0.6" width="6" height="11.4" rx="3"/><path d="M1.2 8.6 C1.2 12.4 3.6 14.6 7 14.6 C10.4 14.6 12.8 12.4 12.8 8.6 M7 14.6 V18.6 M3.8 18.8 H10.2"/></svg>
      </button>
      <input id="utterance" placeholder='Type what you would say, e.g. "Alexa, open In Network."' aria-label="Utterance">
      <button type="submit" class="ctl">Say</button>
      <span class="ctl-gap"></span>
      <button type="button" id="play-demo" class="ctl primary">Play demo</button>
      <button type="button" id="new-session" class="ctl">New session</button>
      <button type="button" id="reset-demo" class="ctl">Reset</button>
      <button type="button" id="theme" class="ctl" aria-pressed="false">Theme: dark</button>
      <button type="button" id="dev-full" class="ctl">Behind the scenes</button>
    </form>
  </section>

  <aside id="dev" aria-label="Developer view">
    <header class="dev-head">
      <h2>Developer view <span>· not shown to customers</span></h2>
      <dl class="dev-meta">
        <div><dt>protocol</dt><dd id="protocol">…</dd></div>
        <div><dt>session</dt><dd id="session">…</dd></div>
        <div><dt>household</dt><dd id="user">…</dd></div>
        <div><dt>directory</dt><dd id="dir-mode">…</dd></div>
      </dl>
      <p class="dev-legend">
        <span class="badge" data-mode="live">LIVE</span><span class="badge" data-mode="file">FILE</span><span class="badge" data-mode="fixture">FIXTURE</span><span class="badge" data-mode="sandbox">SANDBOX</span><span class="badge" data-mode="simulated">SIMULATED</span>
      </p>
    </header>
    <div id="chips"></div>
  </aside>
</div>
<script type="module" src="/host.js"></script>
</body>
</html>
